[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "closer-ai"
version = "0.1.0"
description = "Wellbeing assessment and psychologist alerts for Closer (fictional data only)"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=2.3",
  "gymnasium>=1.0",
  "numpy>=1.26",
  "pillow>=11",
  "sb3-contrib>=2.3",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "stable-baselines3>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["closer_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
